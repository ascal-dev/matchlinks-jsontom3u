name: Netx Hotstar m3u

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Fetch JSON Source
        run: |
          curl -L "${{ secrets.NETX_URL }}" -o source.json

      - name: Validate Source
        id: validate
        run: |
          if [ ! -s source.json ]; then
            echo "count=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          COUNT=$(jq length source.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Generate M3U Playlist
        if: steps.validate.outputs.count != '0'
        run: |

          echo "#EXTM3U" > host.m3u

          jq -c '.[] | select(.id!="sf-top")' source.json | while read item; do

            NAME=$(echo $item | jq -r '.name')
            GROUP=$(echo $item | jq -r '.group')
            LOGO=$(echo $item | jq -r '.logo')
            URL=$(echo $item | jq -r '.m3u8_url')
            UA=$(echo $item | jq -r '.user_agent // empty')
            COOKIE=$(echo $item | jq -r '.headers.Cookie // empty')
            ORIGIN=$(echo $item | jq -r '.headers.Origin // empty')
            REF=$(echo $item | jq -r '.headers.Referer // empty')

            echo "" >> host.m3u

            echo "#EXTINF:-1 tvg-logo=\"$LOGO\" group-title=\"$GROUP\",$NAME" >> host.m3u

            if [ ! -z "$UA" ]; then
              echo "#EXTVLCOPT:http-user-agent=$UA" >> host.m3u
            fi

            if [ ! -z "$REF" ]; then
              echo "#EXTVLCOPT:http-referrer=$REF" >> host.m3u
            fi

            if [ ! -z "$ORIGIN" ]; then
              echo "#EXTVLCOPT:http-origin=$ORIGIN" >> host.m3u
            fi

            if [ ! -z "$COOKIE" ]; then
              echo "#EXTVLCOPT:http-cookie=$COOKIE" >> host.m3u
            fi

            echo "$URL" >> host.m3u

          done

      - name: Commit Playlist
        run: |
          git config --global user.name "netx-bot"
          git config --global user.email "actions@github.com"

          git add host.m3u

          git commit -m "Updated IPTV playlist" || echo "No changes"

          git push
