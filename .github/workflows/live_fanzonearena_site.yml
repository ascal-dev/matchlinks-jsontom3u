name: Live FanZoneareana site

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST
    - cron: '00 9 * * *'   # 02:30 PM IST
    - cron: '00 13 * * *'  # 06:30 PM IST
    - cron: '30 16 * * *'  # 10:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process JioTV Data
        run: |
          # --- CONFIGURATION ---
          PLAYLIST_URL="https://live.fanzonearena.site/79960755/playlist.php"
          OUTPUT_FILE="live.fanzonearena.site.json"
          TEMP_FILE="temp_channels.json"
          
          echo "🚀 STARTING EXTRACTION: $(date)"
          echo "------------------------------------------------------"

          # --- FETCH AND NORMALIZE ---
          # tr -d '\r' removes Windows carriage returns which break Linux scripts
          CONTENT=$(curl -sL "$PLAYLIST_URL" | tr -d '\r')

          if [[ -z "$CONTENT" || "$CONTENT" != *#EXTM3U* ]]; then
            echo "❌ ERROR: Playlist source is empty or invalid."
            exit 0
          fi

          echo "[" > "$OUTPUT_FILE"
          > "$TEMP_FILE"

          # --- SYNCHRONIZED PARSING LOOP ---
          # We read the content line by line to ensure metadata and URLs never desync
          while read -r line; do
            # Skip empty lines
            [[ -z "$line" ]] && continue
            
            if [[ "$line" == *"#EXTINF"* ]]; then
              # Extract Meta Data
              CHANNEL_ID=$(echo "$line" | sed -n 's/.*tvg-id="\([^"]*\)".*/\1/p')
              CATEGORY=$(echo "$line" | sed -n 's/.*group-title="\([^"]*\)".*/\1/p')
              LOGO_URL=$(echo "$line" | sed -n 's/.*tvg-logo="\([^"]*\)".*/\1/p')
              CHANNEL_NAME=$(echo "$line" | sed 's/.*,//' | sed 's/^[[:space:]]*//')

              # CRITICAL: Read the VERY NEXT line immediately to get the Stream URL
              read -r REDIRECT_URL
              
              if [[ "$REDIRECT_URL" == http* ]]; then
                echo "  ▶️ Processing: $CHANNEL_NAME"
                
                # Resolve Redirect to get Jio CDN Path
                FULL_JIO_URL=$(curl -s -L -o /dev/null -w "%{url_effective}" "$REDIRECT_URL")
                
                # Separate Main URL and Token
                if [[ "$FULL_JIO_URL" == *"?"* ]]; then
                  BASE_MPD_URL=$(echo "$FULL_JIO_URL" | cut -d'?' -f1)
                  AUTH_TOKEN="?$(echo "$FULL_JIO_URL" | cut -d'?' -f2)"
                else
                  BASE_MPD_URL="$FULL_JIO_URL"
                  AUTH_TOKEN=""
                fi

                # Fetch DRM Keys (KID and KEY)
                KEY_JSON=$(curl -s "https://live.fanzonearena.site/79960755/keys/$CHANNEL_ID/keys.json")
                KID_VAL=$(echo "$KEY_JSON" | sed -n 's/.*"kid":"\([^"]*\)".*/\1/p')
                KEY_VAL=$(echo "$KEY_JSON" | sed -n 's/.*"k":"\([^"]*\)".*/\1/p')

                # Append to Temp File using printf (Safe formatting)
                printf "  {\n    \"id\": \"%s\",\n    \"name\": \"%s\",\n    \"category\": \"%s\",\n    \"channel_logo\": \"%s\",\n    \"channel_url\": \"%s\",\n    \"token_url\": \"%s\",\n    \"full_url\": \"%s\",\n    \"keyid\": \"%s\",\n    \"key\": \"%s\"\n  },\n" \
                  "$CHANNEL_ID" "$CHANNEL_NAME" "$CATEGORY" "$LOGO_URL" "$BASE_MPD_URL" "$AUTH_TOKEN" "$FULL_JIO_URL" "$KID_VAL" "$KEY_VAL" >> "$TEMP_FILE"
                
                echo "    ✅ Done."
              fi
            fi
          done <<< "$CONTENT"

          # --- FINALIZING JSON ---
          if [ -s "$TEMP_FILE" ]; then
            # Remove the trailing comma from the last entry
            sed -i '$ s/,$//' "$TEMP_FILE"
            cat "$TEMP_FILE" >> "$OUTPUT_FILE"
            echo "]" >> "$OUTPUT_FILE"
            echo "======================================================"
            echo "✨ SUCCESS: $OUTPUT_FILE generated with fresh data."
          else
            echo "❌ ERROR: No data captured. Check the playlist structure."
            exit 1
          fi

          rm "$TEMP_FILE"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live.fanzonearena.site.json
          
          # Only push if there are actual changes in the file
          if git diff --staged --quiet; then
            echo "⏭️ No changes in content. Skipping push."
          else
            git commit -m "Automated JioTV Refresh: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
