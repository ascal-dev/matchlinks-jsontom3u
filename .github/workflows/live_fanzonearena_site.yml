name: Live FanZoneareana site

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST
    - cron: '00 9 * * *'   # 02:30 PM IST
    - cron: '00 13 * * *'  # 06:30 PM IST
    - cron: '30 16 * * *'  # 10:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Hyper-Speed Parallel Extraction
        run: |
          # --- CONFIGURATION ---
          PLAYLIST_URL="https://live.fanzonearena.site/79960755/playlist.php"
          OUTPUT_FILE="live.fanzonearena.site.json"
          
          echo "⚡ Launching Hyper-Speed Extraction..."

          # Fetch playlist once and normalize line endings
          RAW_CONTENT=$(curl -sL "$PLAYLIST_URL" | tr -d '\r')

          if [[ -z "$RAW_CONTENT" || "$RAW_CONTENT" != *#EXTM3U* ]]; then
            echo "❌ Source Empty or Invalid. Aborting update."
            exit 0
          fi

          # Function to process a single channel (Exported for parallel execution)
          process_channel() {
            # Data input format: ID|CATEGORY|LOGO|NAME|URL
            IFS='|' read -r id cat logo name url <<< "$1"
            
            # 1. Resolve Redirect to get direct Jio CDN Path
            # 2. Fetch DRM Keys (KID and KEY) from the fanzonearena API
            FULL_URL=$(curl -s -L -o /dev/null -w "%{url_effective}" "$url")
            KEY_JSON=$(curl -s "https://live.fanzonearena.site/79960755/keys/${id}/keys.json")
            
            # Fast internal splitting for URL and Token
            BASE_URL="${FULL_URL%%\?*}"
            TOKEN=""
            [[ "$FULL_URL" == *"?"* ]] && TOKEN="?${FULL_URL#*\?}"
            
            # Extract Keys using SED
            KID=$(echo "$KEY_JSON" | sed -n 's/.*"kid":"\([^"]*\)".*/\1/p')
            KEY=$(echo "$KEY_JSON" | sed -n 's/.*"k":"\([^"]*\)".*/\1/p')

            # Build the JSON object with ALL fields
            printf "  {\n    \"id\": \"%s\",\n    \"name\": \"%s\",\n    \"category\": \"%s\",\n    \"channel_logo\": \"%s\",\n    \"channel_url\": \"%s\",\n    \"token_url\": \"%s\",\n    \"full_url\": \"%s\",\n    \"keyid\": \"%s\",\n    \"key\": \"%s\"\n  }," \
              "$id" "$name" "$cat" "$logo" "$BASE_URL" "$TOKEN" "$FULL_URL" "$KID" "$KEY"
          }
          export -f process_channel

          # Start JSON array
          echo "[" > "$OUTPUT_FILE"
          
          # AWK extracts clean pipe-separated data
          # xargs processes 15 channels at once for "Speed of Light" performance
          PARSE_RESULTS=$(echo "$RAW_CONTENT" | awk '
            /#EXTINF/ {
              match($0, /tvg-id="([^"]*)"/, id);
              match($0, /group-title="JioTV\+ \| ([^"]*)"/, cat);
              match($0, /tvg-logo="([^"]*)"/, logo);
              split($0, a, ",");
              name = a[2];
              while(getline > 0 && ($0 ~ /^#/ || $0 == "")) continue;
              if ($0 != "") {
                print id[1] "|" cat[1] "|" logo[1] "|" name "|" $0
              }
            }
          ')

          # Calculate total channels found in playlist
          TOTAL_CHANNELS=$(echo "$PARSE_RESULTS" | grep -c "|")
          echo "📊 Total Channels Found: $TOTAL_CHANNELS"

          # Execute parallel processing
          echo "$PARSE_RESULTS" | xargs -I {} -P 15 bash -c 'process_channel "{}"' >> "$OUTPUT_FILE"

          # Finalize JSON syntax
          sed -i '$ s/,$//' "$OUTPUT_FILE"
          echo -e "\n]" >> "$OUTPUT_FILE"
          
          echo "✅ Extracted $TOTAL_CHANNELS channels successfully."

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live.fanzonearena.site.json
          
          if git diff --staged --quiet; then
            echo "⏭️ No changes in data detected. Skipping push."
          else
            # Includes the channel count in the commit message for better history tracking
            CHANNEL_COUNT=$(grep -c "{" live.fanzonearena.site.json)
            git commit -m "Hyper-Speed Refresh: $CHANNEL_COUNT Channels Updated"
            git push
          fi
