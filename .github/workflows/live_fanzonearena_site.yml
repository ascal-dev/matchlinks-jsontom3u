name: Live FanZoneareana site

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST
    - cron: '00 9 * * *'   # 02:30 PM IST
    - cron: '00 13 * * *'  # 06:30 PM IST
    - cron: '30 16 * * *'  # 10:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Hyper-Speed Parallel Extraction
        run: |
          # --- CONFIGURATION ---
          PLAYLIST_URL="https://live.fanzonearena.site/79960755/playlist.php"
          OUTPUT_FILE="live.fanzonearena.site.json"
          
          echo "⚡ Launching Hyper-Speed Extraction..."

          # Fetch playlist once
          RAW_CONTENT=$(curl -sL "$PLAYLIST_URL" | tr -d '\r')

          if [[ -z "$RAW_CONTENT" || "$RAW_CONTENT" != *#EXTM3U* ]]; then
            echo "❌ Source Empty. Aborting."
            exit 0
          fi

          # Function to process a single channel (Exported for xargs)
          # This handles Redirects and Keys for one channel
          process_channel() {
            local id="$1" cat="$2" logo="$3" name="$4" url="$5"
            
            # Resolve Redirect and Keys in parallel
            FULL_URL=$(curl -s -L -o /dev/null -w "%{url_effective}" "$url")
            KEY_JSON=$(curl -s "https://live.fanzonearena.site/79960755/keys/${id}/keys.json")
            
            # Extract logic
            BASE_URL="${FULL_URL%%\?*}"
            TOKEN=""
            [[ "$FULL_URL" == *"?"* ]] && TOKEN="?${FULL_URL#*\?}"
            
            KID=$(echo "$KEY_JSON" | sed -n 's/.*"kid":"\([^"]*\)".*/\1/p')
            KEY=$(echo "$KEY_JSON" | sed -n 's/.*"k":"\([^"]*\)".*/\1/p')

            # Output formatted JSON block to stdout
            printf "  {\n    \"id\": \"%s\",\n    \"name\": \"%s\",\n    \"category\": \"%s\",\n    \"channel_logo\": \"%s\",\n    \"channel_url\": \"%s\",\n    \"token_url\": \"%s\",\n    \"full_url\": \"%s\",\n    \"keyid\": \"%s\",\n    \"key\": \"%s\"\n  }," "$id" "$name" "$cat" "$logo" "$BASE_URL" "$TOKEN" "$FULL_URL" "$KID" "$KEY"
          }
          export -f process_channel

          # 1. Parse M3U into a clean data stream using AWK (Blazing fast)
          # 2. Use xargs -P 10 to process 10 channels at the same time
          echo "[" > "$OUTPUT_FILE"
          
          echo "$RAW_CONTENT" | awk '
            /#EXTINF/ {
              match($0, /tvg-id="([^"]*)"/, id);
              match($0, /group-title="JioTV\+ \| ([^"]*)"/, cat);
              match($0, /tvg-logo="([^"]*)"/, logo);
              split($0, a, ",");
              name = a[2];
              getline; while($0 ~ /^#/) getline;
              print id[1] "|" cat[1] "|" logo[1] "|" name "|" $0
            }
          ' | xargs -d '\n' -I {} -P 10 bash -c 'process_channel $(echo "{}" | tr "|" "\n")' >> "$OUTPUT_FILE"

          # Finalize: Remove trailing comma and close bracket
          sed -i '$ s/,$//' "$OUTPUT_FILE"
          echo -e "\n]" >> "$OUTPUT_FILE"
          
          echo "🏁 Extraction finished in record time."

      - name: Push to Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live.fanzonearena.site.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Hyper-Speed Update: $(date)" && git push)
