name: Live FanZoneareana site



permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Hyper-Speed Parallel Extraction
        run: |
          # --- CONFIGURATION ---
          PLAYLIST_URL="https://live.fanzonearena.site/79960755/playlist.php"
          OUTPUT_FILE="live.fanzonearena.site.json"
          
          echo "⚡ Launching Hyper-Speed Extraction with HEX DRM Conversion..."

          # Fetch playlist once and normalize line endings
          RAW_CONTENT=$(curl -sL "$PLAYLIST_URL" | tr -d '\r')

          if [[ -z "$RAW_CONTENT" || "$RAW_CONTENT" != *#EXTM3U* ]]; then
            echo "❌ Source Empty or Invalid. Aborting update."
            exit 0
          fi

          # Function to process a single channel (Exported for parallel execution)
          process_channel() {
            IFS='|' read -r id cat logo name url <<< "$1"
            
            # 1. Resolve Redirect
            FULL_URL=$(curl -s -L -o /dev/null -w "%{url_effective}" "$url")
            
            # 2. Fetch DRM Keys
            KEY_JSON=$(curl -s "https://live.fanzonearena.site/79960755/keys/${id}/keys.json")
            
            # 3. Split URL and Token
            BASE_URL="${FULL_URL%%\?*}"
            TOKEN=""
            [[ "$FULL_URL" == *"?"* ]] && TOKEN="?${FULL_URL#*\?}"
            
            # 4. Extract Base64URL Keys
            B64_KID=$(echo "$KEY_JSON" | sed -n 's/.*"kid":"\([^"]*\)".*/\1/p')
            B64_KEY=$(echo "$KEY_JSON" | sed -n 's/.*"k":"\([^"]*\)".*/\1/p')

            # 5. Helper function to convert Base64URL to HEX
            to_hex() {
              local input="$1"
              [[ -z "$input" ]] && echo "" && return
              # Convert Base64URL to Standard Base64
              local base64_str=$(echo "$input" | tr -- '-_' '+/')
              # Add padding if necessary
              local mod=$((${#base64_str} % 4))
              [[ $mod -eq 2 ]] && base64_str="${base64_str}=="
              [[ $mod -eq 3 ]] && base64_str="${base64_str}="
              # Decode to Hex
              echo "$base64_str" | openssl enc -d -base64 | xxd -p -c 256 | tr -d ' \n'
            }

            HEX_KID=$(to_hex "$B64_KID")
            HEX_KEY=$(to_hex "$B64_KEY")

            # Build the JSON object
            printf "  {\n    \"id\": \"%s\",\n    \"name\": \"%s\",\n    \"category\": \"%s\",\n    \"channel_logo\": \"%s\",\n    \"channel_url\": \"%s\",\n    \"token_url\": \"%s\",\n    \"full_url\": \"%s\",\n    \"keyid\": \"%s\",\n    \"key\": \"%s\"\n  }," \
              "$id" "$name" "$cat" "$logo" "$BASE_URL" "$TOKEN" "$FULL_URL" "$HEX_KID" "$HEX_KEY"
          }
          export -f process_channel

          echo "[" > "$OUTPUT_FILE"
          
          # Parse M3U and run 15 parallel threads
          PARSE_RESULTS=$(echo "$RAW_CONTENT" | awk '
            /#EXTINF/ {
              match($0, /tvg-id="([^"]*)"/, id);
              match($0, /group-title="JioTV\+ \| ([^"]*)"/, cat);
              match($0, /tvg-logo="([^"]*)"/, logo);
              split($0, a, ",");
              name = a[2];
              while(getline > 0 && ($0 ~ /^#/ || $0 == "")) continue;
              if ($0 != "") {
                print id[1] "|" cat[1] "|" logo[1] "|" name "|" $0
              }
            }
          ')

          TOTAL_CHANNELS=$(echo "$PARSE_RESULTS" | grep -c "|")
          echo "📊 Total Channels Found: $TOTAL_CHANNELS"

          echo "$PARSE_RESULTS" | xargs -I {} -P 15 bash -c 'process_channel "{}"' >> "$OUTPUT_FILE"

          # Finalize JSON
          sed -i '$ s/,$//' "$OUTPUT_FILE"
          echo -e "\n]" >> "$OUTPUT_FILE"
          
          echo "✅ Extracted $TOTAL_CHANNELS channels with HEX keys."

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live.fanzonearena.site.json
          
          if git diff --staged --quiet; then
            echo "⏭️ No changes detected."
          else
            COUNT=$(grep -c "{" live.fanzonearena.site.json)
            git commit -m "Hex DRM Refresh: $COUNT Channels Updated"
            git push
          fi
