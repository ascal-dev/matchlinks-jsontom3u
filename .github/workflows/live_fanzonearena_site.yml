name: Live FanZoneareana site

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 AM IST
    - cron: '30 6 * * *'   # 12:00 PM IST
    - cron: '00 9 * * *'   # 02:30 PM IST
    - cron: '00 13 * * *'  # 06:30 PM IST
    - cron: '30 16 * * *'  # 10:00 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process JioTV Data
        run: |
          # --- 🟢 CONFIGURATION & INITIALIZATION 🟢 ---
          PLAYLIST_URL="https://live.fanzonearena.site/79960755/playlist.php"
          OUTPUT_FILE="live.fanzonearena.site.json"
          TEMP_FILE="temp_channels.json"
          
          echo "🚀 STARTING FULL EXTRACTION: $(date)"
          echo "------------------------------------------------------"

          # Fetch playlist and strip carriage returns (\r) for Linux compatibility
          CONTENT=$(curl -sL "$PLAYLIST_URL" | tr -d '\r')

          # Validate content: if source is down, stop to prevent deleting existing data
          if [[ -z "$CONTENT" || "$CONTENT" != *#EXTM3U* ]]; then
            echo "❌ CRITICAL ERROR: Playlist source is empty or invalid."
            exit 0
          fi

          # Initialize JSON and clear temp storage
          echo "[" > "$OUTPUT_FILE"
          > "$TEMP_FILE"

          # --- 🔄 PARSING ENGINE 🔄 ---
          # This loop identifies metadata and waits for the specific stream URL
          while read -r line; do
            # Skip empty lines
            [[ -z "$line" ]] && continue
            
            # 1. Detect Metadata Line
            if [[ "$line" == *"#EXTINF"* ]]; then
              CH_ID=$(echo "$line" | sed -n 's/.*tvg-id="\([^"]*\)".*/\1/p')
              # Extract category from 'JioTV+ | Category' format
              CH_CAT=$(echo "$line" | sed -n 's/.*group-title="JioTV+ | \([^"]*\)".*/\1/p')
              CH_LOGO=$(echo "$line" | sed -n 's/.*tvg-logo="\([^"]*\)".*/\1/p')
              CH_NAME=$(echo "$line" | sed 's/.*,//' | sed 's/^[[:space:]]*//')
              continue
            fi

            # 2. Detect Stream URL (Skips KODIPROP and EXTVLCOPT lines)
            if [[ "$line" == https://* ]]; then
              STREAM_REDIRECT_URL="$line"
              
              if [[ -n "$CH_ID" ]]; then
                echo "  ▶️ Processing: $CH_NAME (ID: $CH_ID)"
                
                # Resolve Redirect to get the direct Jio CDN link
                # We use -L to follow and -w to extract the final effective URL
                FULL_JIO_URL=$(curl -s -L -o /dev/null -w "%{url_effective}" "$STREAM_REDIRECT_URL")
                
                # ✂️ Split the Base URL from the Token (?__hdnea__)
                if [[ "$FULL_JIO_URL" == *"?"* ]]; then
                  BASE_MPD_URL=$(echo "$FULL_JIO_URL" | cut -d'?' -f1)
                  AUTH_TOKEN="?$(echo "$FULL_JIO_URL" | cut -d'?' -f2)"
                  echo "    🔗 CDN Resolved."
                else
                  BASE_MPD_URL="$FULL_JIO_URL"
                  AUTH_TOKEN=""
                  echo "    ⚠️ Warning: No Token Found."
                fi

                # 🔑 Fetch DRM Keys (KID and KEY) from the API
                KEY_JSON=$(curl -s "https://live.fanzonearena.site/79960755/keys/$CH_ID/keys.json")
                KID_VAL=$(echo "$KEY_JSON" | sed -n 's/.*"kid":"\([^"]*\)".*/\1/p')
                KEY_VAL=$(echo "$KEY_JSON" | sed -n 's/.*"k":"\([^"]*\)".*/\1/p')

                # 📝 Write Channel Object to Temp File (Long Format)
                printf "  {\n    \"id\": \"%s\",\n    \"name\": \"%s\",\n    \"category\": \"%s\",\n    \"channel_logo\": \"%s\",\n    \"channel_url\": \"%s\",\n    \"token_url\": \"%s\",\n    \"full_url\": \"%s\",\n    \"keyid\": \"%s\",\n    \"key\": \"%s\"\n  },\n" \
                  "$CH_ID" \
                  "$CH_NAME" \
                  "$CH_CAT" \
                  "$CH_LOGO" \
                  "$BASE_MPD_URL" \
                  "$AUTH_TOKEN" \
                  "$FULL_JIO_URL" \
                  "$KID_VAL" \
                  "$KEY_VAL" >> "$TEMP_FILE"
                
                # Reset metadata buffer for next channel
                CH_ID=""
                echo "    🏁 Done."
              fi
            fi
          done <<< "$CONTENT"

          # --- 📂 FINALIZING JSON 📂 ---
          if [ -s "$TEMP_FILE" ]; then
            # Remove trailing comma from the last entry to ensure valid JSON
            sed -i '$ s/,$//' "$TEMP_FILE"
            cat "$TEMP_FILE" >> "$OUTPUT_FILE"
            echo "]" >> "$OUTPUT_FILE"
            echo "------------------------------------------------------"
            echo "✨ SUCCESS: $OUTPUT_FILE has been updated."
          else
            echo "❌ ERROR: No channel data was captured. Process failed."
            exit 1
          fi

          # Cleanup temp file
          rm "$TEMP_FILE"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add live.fanzonearena.site.json
          
          # Only push if changes exist
          if git diff --staged --quiet; then
            echo "⏭️ No changes detected. Skipping Push."
          else
            git commit -m "Automated JioTV Refresh: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
