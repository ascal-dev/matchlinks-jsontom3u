name: Update TPlay Channels



permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Scrape and Update Channels
        run: |
          python << 'EOF'
          import subprocess
          import re
          import json
          import os
          import sys

          BASE_URL = "https://allinonereborn.online/tplay"
          CHANNELS_JSON_URL = f"{BASE_URL}/channels.json"
          PLAYER_URL = f"{BASE_URL}/play.php?id="
          
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.6723.70 Safari/537.36"
          REFERER = f"{BASE_URL}/"
          COOKIE = "s9ifs0idfjlwfie32dekl=0;"

          def run_curl(url):
              """Helper to execute curl commands"""
              try:
                  result = subprocess.run([
                      'curl', '-s', '-L', 
                      '--connect-timeout', '10',
                      '--max-time', '20',
                      '-H', f'User-Agent: {UA}',
                      '-H', f'Referer: {REFERER}',
                      '-H', f'Cookie: {COOKIE}',
                      url
                  ], capture_output=True, text=True)
                  return result.stdout
              except Exception as e:
                  print(f"   ❌ [CURL ERROR]: {e}")
                  return ""

          def get_stream_details(channel_id):
              html = run_curl(f"{PLAYER_URL}{channel_id}")
              if not html:
                  return None
              
              config_match = re.search(r'const streamConfig = (\{.*?\});', html, re.DOTALL)
              if config_match:
                  config_str = config_match.group(1)
                  
                  # Regex with fallback to empty string
                  def extract(pattern):
                      m = re.search(pattern, config_str)
                      return m.group(1) if m else ""

                  mpd = extract(r'mpd:\s*"(.*?)"')
                  token = extract(r'token:\s*"(.*?)"')
                  ref = extract(r'referer:\s*"(.*?)"')
                  user_a = extract(r'userAgent:\s*"(.*?)"')
                  
                  drm_match = re.search(r'drm:\s*(\{.*?\})', config_str, re.DOTALL)
                  drm = json.loads(drm_match.group(1).replace("'", '"')) if drm_match else {}

                  if mpd and token:
                      print(f"   ✅ [EXTRACTED] MPD: {mpd[:30]}... | Token: {token[:15]}...")
                      return {
                          "mpd": mpd,
                          "token": token,
                          "referer": ref,
                          "userAgent": user_a,
                          "drm": drm
                      }
              print(f"   ⚠️ [SKIP] ID {channel_id}: streamConfig not parseable.")
              return None

          print("\n--- 📡 STEP 1: FETCHING MASTER LIST (via CURL) ---")
          master_data = run_curl(CHANNELS_JSON_URL)
          try:
              channels = json.loads(master_data)
              print(f"✅ [SUCCESS] Loaded {len(channels)} channels.\n")
          except Exception as e:
              print(f"❌ [CRITICAL] Failed to parse master JSON: {e}")
              sys.exit(1)

          updated_list = []
          success_count = 0
          fail_count = 0

          print("--- ⚙️ STEP 2: CURLING INDIVIDUAL CHANNELS ---")
          for index, channel in enumerate(channels, 1):
              cid = channel.get("id")
              cname = channel.get("name", "Unknown")
              
              print(f"[{index}/{len(channels)}] 📡 Requesting: {cname} (ID: {cid})")
              
              details = get_stream_details(cid)
              if details:
                  channel.update(details)
                  success_count += 1
                  print(f"   📝 [UPDATED] {cname} data updated.")
              else:
                  fail_count += 1
              
              updated_list.append(channel)

          print("\n--- 💾 STEP 3: WRITING tply.json ---")
          with open("tply.json", "w") as f:
              json.dump(updated_list, f, indent=4)
          print(f"✅ [DONE] Saved to disk.")

          print("\n--- 📊 FINAL REPORT ---")
          print(f"Total: {len(channels)} | Success: {success_count} ✅ | Failed: {fail_count} ❌")
          EOF

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tply.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update streams: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
