name: Update TPlay Channels

on:
  schedule:
    - cron: '0 */3 * * *' # Runs every 3 hours
  workflow_dispatch: # Allows manual run

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape and Update Channels
        run: |
          python << 'EOF'
          import requests
          import re
          import json
          import os
          import sys

          BASE_URL = "https://allinonereborn.online/tplay"
          CHANNELS_JSON_URL = f"{BASE_URL}/channels.json"
          PLAYER_URL = f"{BASE_URL}/play.php?id="
          
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.6723.70 Safari/537.36",
              "Referer": f"{BASE_URL}/",
              "Cookie": "s9ifs0idfjlwfie32dekl=0;"
          }

          def get_stream_details(channel_id):
              try:
                  response = requests.get(f"{PLAYER_URL}{channel_id}", headers=headers, timeout=15)
                  html = response.text
                  
                  config_match = re.search(r'const streamConfig = (\{.*?\});', html, re.DOTALL)
                  if config_match:
                      config_str = config_match.group(1)
                      
                      # Extract fields
                      mpd = re.search(r'mpd:\s*"(.*?)"', config_str).group(1)
                      token = re.search(r'token:\s*"(.*?)"', config_str).group(1)
                      referer = re.search(r'referer:\s*"(.*?)"', config_str).group(1)
                      ua = re.search(r'userAgent:\s*"(.*?)"', config_str).group(1)
                      
                      drm_match = re.search(r'drm:\s*(\{.*?\})', config_str, re.DOTALL)
                      drm = json.loads(drm_match.group(1).replace("'", '"')) if drm_match else {}

                      print(f"   ✅ [EXTRACTED] Stream found for ID: {channel_id}")
                      return {
                          "mpd": mpd,
                          "token": token,
                          "referer": referer,
                          "userAgent": ua,
                          "drm": drm
                      }
                  else:
                      print(f"   ⚠️ [SKIP] streamConfig missing for ID: {channel_id}")
              except Exception as e:
                  print(f"   ❌ [ERROR] Failed ID {channel_id}: {str(e)}")
              return None

          print("\n--- 📡 STEP 1: FETCHING MASTER LIST ---")
          try:
              res = requests.get(CHANNELS_JSON_URL, headers=headers, timeout=10)
              res.raise_for_status()
              channels = res.json()
              print(f"✅ [SUCCESS] Master list received: {len(channels)} channels.\n")
          except Exception as e:
              print(f"❌ [CRITICAL] Could not fetch list: {e}")
              sys.exit(1)

          updated_list = []
          success_count = 0
          fail_count = 0

          print("--- ⚙️ STEP 2: SCRAPING & UPDATING ---")
          for index, channel in enumerate(channels, 1):
              cid = channel.get("id")
              cname = channel.get("name", "Unknown")
              
              print(f"[{index}/{len(channels)}] Scrutinizing: {cname} (ID: {cid})")
              
              details = get_stream_details(cid)
              if details:
                  channel.update(details)
                  success_count += 1
                  print(f"   📝 [UPDATED] Scraped tokens added to channel object.")
              else:
                  fail_count += 1
              
              updated_list.append(channel)

          print("\n--- 💾 STEP 3: WRITING TO FILE ---")
          try:
              with open("tply.json", "w") as f:
                  json.dump(updated_list, f, indent=4)
              print(f"✅ [DONE] All changes written to tply.json")
          except Exception as e:
              print(f"❌ [ERROR] File write failed: {e}")

          print("\n--- 📊 FINAL REPORT ---")
          print(f"Total: {len(channels)} | Success: {success_count} ✅ | Failed: {fail_count} ❌")
          print("------------------------------\n")
          EOF

      - name: Verify JSON File
        run: |
          if [ -f tply.json ]; then
            echo "✅ tply.json exists and is ready for commit."
            ls -lh tply.json
          else
            echo "❌ tply.json was not created!"
            exit 1
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tply.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit. Stream tokens are already up to date."
          else
            git commit -m "Auto-update tply.json: $(date +'%Y-%m-%d %H:%M:%S')"
            git push
          fi
