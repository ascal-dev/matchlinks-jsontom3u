name: webcapture allinonereborn


on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Scrape Data
        shell: python
        run: |
          import requests
          import re
          import json
          import time

          # --- CONFIGURATION ---
          M3U_URL = "https://raw.githubusercontent.com/ascal-dev/matchlinks-jsontom3u/main/Refined.m3u"
          PHP_BASE_URL = "https://allinonerebornxjtv.iceiy.com/jtvxweb/pind.php?id={}&i=2"
          
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.6723.70 Safari/537.36",
              "Cookie": "__test=bc343951fa31675be002acbfa68b6a51",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
              "Connection": "keep-alive"
          })

          print("Step 1: Fetching M3U...")
          try:
              m3u_res = session.get(M3U_URL)
              m3u_content = m3u_res.text
          except Exception as e:
              print(f"Failed to fetch M3U: {e}")
              exit(1)

          # Improved Regex to catch IDs more reliably
          pattern = re.compile(r'tvg-id="(\d+)".*?tvg-logo="(.*?)",(.*)')
          matches = pattern.findall(m3u_content)

          if not matches:
              print("Critical Error: No channels found in M3U. Check your Regex!")
              # Fallback regex just in case
              matches = re.findall(r'tvg-id="(.*?)".*?logo="(.*?)",(.*)', m3u_content)

          final_list = []

          print(f"Step 2: Processing {len(matches)} channels...")
          for tvg_id, logo, name in matches:
              target_url = PHP_BASE_URL.format(tvg_id)
              
              try:
                  # Anti-bot measure: dynamically update Referer
                  headers = {"Referer": f"https://allinonerebornxjtv.iceiy.com/jtvxweb/pind.php?id={tvg_id}&i=1"}
                  response = session.get(target_url, headers=headers, timeout=15)
                  
                  # Search for the SERVER_CONFIG
                  json_match = re.search(r'const SERVER_CONFIG\s*=\s*(\{.*?\});', response.text)
                  
                  if json_match:
                      config = json.loads(json_match.group(1))
                      
                      final_list.append({
                          "name": name.strip(),
                          "id": tvg_id,
                          "logo": logo,
                          "streamUrl": config.get("streamUrls", [""])[0],
                          "keyId": config.get("keyId", ""),
                          "key": config.get("key", ""),
                          "token": config.get("primaryCookie", ""),
                          "fallbackCookie": config.get("fallbackCookie", "")
                      })
                      print(f" Success: {name.strip()}")
                  else:
                      print(f" No Config Found for {name.strip()} (ID: {tvg_id})")
                      # Optional: Print response.text[:200] here to debug if blocked
                  
                  time.sleep(1) # Slightly longer delay to be safe

              except Exception as e:
                  print(f" Error on ID {tvg_id}: {e}")

          with open("channels_output.json", "w", encoding="utf-8") as f:
              json.dump(final_list, f, indent=4)
          print(f"Step 3: Finished! Saved {len(final_list)} channels.")

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels_output.json
          git commit -m "Update channels: $(date)" || exit 0
          git push
