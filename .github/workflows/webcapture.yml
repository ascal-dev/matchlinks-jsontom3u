name: Ultimate Dynamic Scraper (Full/Limit Toggle)

on:
  schedule:
   # Runs exactly every 21 hours
    - cron: '0 */21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install axios puppeteer

      - name: Run Scraper
        run: |
          cat << 'EOF' > scraper.js
          const puppeteer = require('puppeteer');
          const axios = require('axios');
          const fs = require('fs');

          const M3U_URL = "https://raw.githubusercontent.com/ascal-dev/matchlinks-jsontom3u/main/Refined.m3u";
          const PHP_BASE = "https://allinonerebornxjtv.iceiy.com/jtvxweb/pind.php";
          
          // SETTING: Set to null to scrape ALL channels, or a number (e.g., 100) to limit.
          const SCRAPE_LIMIT = null; 

          async function getDynamicSession() {
              console.log("--- [SYSTEM] SOLVING JS CHALLENGE ---");
              const browser = await puppeteer.launch({ headless: true, args: ['--no-sandbox'] });
              const page = await browser.newPage();
              const realUA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";
              await page.setUserAgent(realUA);
              await page.goto(`${PHP_BASE}?id=144&i=1`, { waitUntil: 'networkidle2' });
              await new Promise(r => setTimeout(r, 8000)); 
              const cookies = await page.cookies();
              const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');
              await browser.close();
              return { cookieStr, ua: realUA };
          }

          async function fetchWithRetry(item, headers, maxRetries = 3) {
              for (let attempt = 1; attempt <= maxRetries; attempt++) {
                  try {
                      // Handshake Step 1
                      await axios.get(`${PHP_BASE}?id=${item.id}&i=1`, { headers, timeout: 15000 });
                      await new Promise(r => setTimeout(r, 1000));

                      // Handshake Step 2
                      const res = await axios.get(`${PHP_BASE}?id=${item.id}&i=2`, { headers, timeout: 15000 });
                      const configMatch = res.data.match(/const\s+SERVER_CONFIG\s*=\s*(\{.*?\});/s);
                      
                      if (configMatch) {
                          const config = JSON.parse(configMatch[1]);
                          
                          // DETAILED LOGS FOR VERIFICATION
                          console.log(`\n✅ [SUCCESS] ${item.name}`);                    
                          
                          return config;
                      } else {
                          throw new Error("CONFIG_NOT_FOUND_IN_HTML");
                      }
                  } catch (err) {
                      console.log(`⚠️ [RETRY ${attempt}/${maxRetries}] ${item.name} | ${err.message}`);
                      if (attempt === maxRetries) return null;
                      // Exponential backoff: 4s, 8s, 12s...
                      await new Promise(r => setTimeout(r, 4000 * attempt));
                  }
              }
          }

          async function scrape() {
            try {
                const { cookieStr, ua } = await getDynamicSession();
                const m3uRes = await axios.get(M3U_URL);
                
                const regex = /#EXTINF:-1.*?tvg-id="(\d+)"\s*.*?tvg-logo="(.*?)",(.*)/g;
                let match;
                let allChannels = [];
                while ((match = regex.exec(m3uRes.data)) !== null) {
                  allChannels.push({ id: match[1].trim(), logo: match[2], name: match[3].trim() });
                }

                // DYNAMIC LIMIT LOGIC: If SCRAPE_LIMIT is null, it scrapes the full list.
                const channels = SCRAPE_LIMIT ? allChannels.slice(0, SCRAPE_LIMIT) : allChannels;
                console.log(`--- [START] PROCESSING ${channels.length} CHANNELS (LIMIT: ${SCRAPE_LIMIT || 'NONE'}) ---`);

                const finalData = [];
                const batchSize = 2; // Keep small to prevent 508 Resource Limit Errors

                for (let i = 0; i < channels.length; i += batchSize) {
                  const batch = channels.slice(i, i + batchSize);
                  
                  const results = await Promise.all(batch.map(async (item) => {
                    const headers = { 
                        "User-Agent": ua, 
                        "Cookie": cookieStr, 
                        "Referer": `${PHP_BASE}?id=${item.id}&i=1` 
                    };
                    const config = await fetchWithRetry(item, headers);
                    
                    if (config) {
                        return {
                          "name": item.name,
                          "id": item.id,
                          "logo": item.logo,
                          "streamUrl": config.streamUrls?.[0] || "",
                          "keyId": config.keyId || "",
                          "key": config.key || "",
                          "token": config.primaryCookie || "",
                          "fallbackCookie": config.fallbackCookie || ""
                        };
                      }
                    return null;
                  }));

                  finalData.push(...results.filter(r => r !== null));
                  
                  // Necessary delay between batches for server stability
                  await new Promise(r => setTimeout(r, 3500)); 
                }

                fs.writeFileSync('channels_output.json', JSON.stringify(finalData, null, 4));
                console.log(`\n--- [FINISH] SAVED ${finalData.length} CHANNELS TO JSON ---`);
            } catch (err) {
                console.error("FATAL ERROR:", err.message);
                process.exit(1);
            }
          }

          scrape();
          EOF
          node scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels_output.json
          git commit -m "Full Scrape All Channels: $(date)" || exit 0
          git push
