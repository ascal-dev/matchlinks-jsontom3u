name: Generate Sports Playlist

on:
  schedule:
    - cron: "0 * * * *" # Runs every 1 hour
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Sports Channels
        env:
          ASTOR_URL: ${{ secrets.ASTOR }}
        run: |
          # 1. Fetch the raw content from the secret link
          curl -s -L "$ASTOR_URL" > raw_data.txt

          # 2. Safety Check: If source is empty, stop here
          if [ ! -s raw_data.txt ]; then
            echo "Source file is empty. No update performed."
            exit 0
          fi

          # 3. Create the header for the new astor.m3u file
          echo "#EXTM3U x-tvg-url=\"https://avkb.short.gy/jioepg.xml.gz\"" > astor.m3u.tmp
          echo "" >> astor.m3u.tmp

          # 4. Extract Sports blocks
          # Grabs the Sports #EXTINF line and the subsequent lines (KODIPROPs, User-Agent, and URL)
          grep -iA 5 'group-title="Sports"' raw_data.txt | sed '/^--$/d' >> astor.m3u.tmp

          # 5. Only overwrite astor.m3u if we actually found Sports content
          if grep -q "EXTINF" astor.m3u.tmp; then
            mv astor.m3u.tmp astor.m3u
            echo "astor.m3u successfully updated."
          else
            echo "No Sports channels found. Protecting existing file."
            rm astor.m3u.tmp
          fi

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          git add astor.m3u
          if git diff --staged --quiet; then
            echo "No changes found in Sports channels."
          else
            git commit -m "Update Sports Playlist: $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
