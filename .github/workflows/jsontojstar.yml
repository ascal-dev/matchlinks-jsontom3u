name: jsontojstar.yml

on:
  schedule:
    - cron: '0 * * * *'   # Every 1 hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch JSON from Secret URL (JSTAR)
        run: |
          curl -L "${{ secrets.JSTAR }}" -o data.json

      - name: Validate JSON & Generate M3U
        run: |
          # Check if file exists and not empty
          if [ ! -s data.json ]; then
            echo "JSON file is empty. Skipping update."
            exit 0
          fi

          # Check if valid JSON
          if ! jq empty data.json 2>/dev/null; then
            echo "Invalid JSON. Skipping update."
            exit 0
          fi

          COUNT=$(jq length data.json)

          if [ "$COUNT" -eq 0 ]; then
            echo "No channels found in JSON. Skipping update."
            exit 0
          fi

          # Clear and recreate M3U
          echo '#EXTM3U x-tvg-url="https://avkb.short.gy/jioepg.xml.gz"' > ascaljstar.m3u
          echo "" >> ascaljstar.m3u

          # Loop through channels
          jq -c '.[]' data.json | while read channel; do
              id=$(echo $channel | jq -r '.channel_id')
              name=$(echo $channel | jq -r '.channel_name')
              logo=$(echo $channel | jq -r '.channel_logo')
              genre=$(echo $channel | jq -r '.channel_genre')
              keyid=$(echo $channel | jq -r '.keyId')
              key=$(echo $channel | jq -r '.key')
              cookie=$(echo $channel | jq -r '.cookie')
              url=$(echo $channel | jq -r '.channel_url')

              echo "#EXTINF:-1 tvg-logo=\"$logo\" tvg-id=\"$id\" group-title=\"$genre\",$name" >> ascaljstar.m3u
              echo "#KODIPROP:inputstream.adaptive.license_type=clearkey" >> ascaljstar.m3u
              echo "#KODIPROP:inputstream.adaptive.license_key=$keyid:$key" >> ascaljstar.m3u
              echo "#EXTVLCOPT:http-user-agent=StreamFlex/7.1.3 (Linux;Android 13) StreamFlex/69.1 ExoPlayerLib/824.0" >> ascaljstar.m3u
              echo "#EXTHTTP:{\"cookie\":\"$cookie\"}" >> ascaljstar.m3u
              echo "$url&xxx=%7Ccookie=$cookie" >> ascaljstar.m3u
              echo "" >> ascaljstar.m3u
          done

      - name: Commit & Push If Changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add ascaljstar.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto update ascaljstar.m3u"
            git push
          fi
