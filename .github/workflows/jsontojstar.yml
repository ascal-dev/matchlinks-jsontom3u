- name: Install Python Dependencies
        run: pip install pycryptodome requests

      - name: Fetch JSON with Auto-Cookie Bypass
        shell: python
        run: |
          import requests
          import re
          import binascii
          from Crypto.Cipher import AES

          url = "${{ secrets.JSTAR }}"
          headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'}

          # 1. Get the challenge page
          response = requests.get(url, headers=headers)
          content = response.text

          # 2. Extract hex values (a, b, c) using Regex
          # Looking for strings like: toNumbers("f655ba9d...")
          hex_matches = re.findall(r'toNumbers\("([a-f0-9]+)"\)', content)

          if len(hex_matches) < 3:
              print("Could not find challenge keys. Site might be down or changed.")
              exit(1)

          a_key = binascii.unhexlify(hex_matches[0])
          b_iv = binascii.unhexlify(hex_matches[1])
          c_data = binascii.unhexlify(hex_matches[2])

          # 3. Solve the AES challenge (Mode: CBC, No Padding in this specific implementation)
          cipher = AES.new(a_key, AES.MODE_CBC, b_iv)
          decrypted_hex = binascii.hexlify(cipher.decrypt(c_data)).decode()

          # 4. Use the solved cookie to get the real JSON
          cookies = {'__test': decrypted_hex}
          print(f"Bypassing with cookie: {decrypted_hex}")
          
          final_response = requests.get(url, headers=headers, cookies=cookies)
          
          with open("data.json", "w") as f:
              f.write(final_response.text)
