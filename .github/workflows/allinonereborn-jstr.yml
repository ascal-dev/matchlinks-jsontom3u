name: allinonenorn-jstr.m3u

on:
  schedule:
    - cron: "0 * * * *"   # every 1 hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate M3U
        env:
          SOURCE_URL: ${{ secrets.JSTR_SOURCE_URL }}
        run: |
          node << 'EOF'
          const fs = require("fs");
          const https = require("https");

          const URL = process.env.SOURCE_URL;
          const OUT = "allinonenorn-jstr.m3u";

          if (!URL) {
            console.error("JSTR_SOURCE_URL secret is missing");
            process.exit(1);
          }

          function fetchJSON(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                let data = "";

                if (res.statusCode !== 200) {
                  reject(
                    new Error(`Request failed with status ${res.statusCode}`)
                  );
                  return;
                }

                res.on("data", chunk => {
                  data += chunk;
                });

                res.on("end", () => {
                  try {
                    const json = JSON.parse(data);
                    resolve(json);
                  } catch (err) {
                    reject(
                      new Error("Invalid JSON received from source URL")
                    );
                  }
                });
              }).on("error", reject);
            });
          }

          (async () => {
            try {
              const data = await fetchJSON(URL);

              if (!Array.isArray(data)) {
                throw new Error("Source JSON is not an array");
              }

              let m3u =
                '#EXTM3U x-tvg-url="https://avkb.short.gy/jioepg.xml.gz"\n\n';

              data.forEach(ch => {
                if (!ch.url || !ch.keyId || !ch.key) {
                  console.log(`Skipping invalid channel: ${ch.name || "Unknown"}`);
                  return;
                }

                const kid = ch.keyId;
                const key = ch.key;
                const name = ch.name || "Unknown";
                const logo = ch.logo || "";
                const group = ch.category || "Other";
                const id = ch.id || "";

                m3u += `#EXTINF:-1 tvg-id="${id}" tvg-logo="${logo}" group-title="${group}",${name}\n`;
                m3u += `#KODIPROP:inputstream.adaptive.license_type=clearkey\n`;
                m3u += `#KODIPROP:inputstream.adaptive.license_key=${kid}:${key}\n`;
                m3u += `#EXTVLCOPT:http-user-agent=StreamFlex/7.1.3 (Linux;Android 13) StreamFlex/69.1 ExoPlayerLib/824.0\n`;
                m3u += `${ch.url}\n\n`;
              });

              fs.writeFileSync(OUT, m3u, "utf8");

              console.log(`M3U generated successfully: ${OUT}`);
            } catch (err) {
              console.error("Error generating M3U:");
              console.error(err);
              process.exit(1);
            }
          })();
          EOF

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add allinonenorn-jstr.m3u

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "Auto update allinonenorn-jstr.m3u"

          git push
