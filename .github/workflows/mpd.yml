name: Convert MPD Repo to M3U (No Duplicates)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download source file
        env:
          SRC: ${{ secrets.SOURCE_RAW_URL }}
        run: |
          curl -L "$SRC" -o source.txt

      - name: Copy as-is to M3U
        run: |
          cp source.txt mpd-to-m3u.m3u

      - name: Commit final playlist
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add mpd-to-m3u.m3u
          git commit -m "Copy MPD to M3U (no changes)" || echo "No changes"
          git push
