name: Full Dynamic Channel Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install axios puppeteer

      - name: Run Full Scraper
        run: |
          cat << 'EOF' > scraper.js
          const puppeteer = require('puppeteer');
          const axios = require('axios');
          const fs = require('fs');

          const M3U_URL = "https://raw.githubusercontent.com/ascal-dev/matchlinks-jsontom3u/main/Refined.m3u";
          const PHP_BASE = "https://allinonerebornxjtv.iceiy.com/jtvxweb/pind.php";

          async function getDynamicSession() {
              console.log("[1/3] Launching browser to bypass JS challenge...");
              const browser = await puppeteer.launch({ 
                  headless: true, 
                  args: ['--no-sandbox', '--disable-setuid-sandbox'] 
              });
              const page = await browser.newPage();
              await page.setUserAgent("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36");
              
              await page.goto(`${PHP_BASE}?id=144&i=1`, { waitUntil: 'networkidle2' });
              await new Promise(r => setTimeout(r, 6000)); 
              
              const cookies = await page.cookies();
              const cookieStr = cookies.map(c => `${c.name}=${c.value}`).join('; ');
              const ua = await page.evaluate(() => navigator.userAgent);
              
              await browser.close();
              console.log("[2/3] Dynamic Cookie Obtained:", cookieStr);
              return { cookieStr, ua };
          }

          async function scrape() {
            try {
                const { cookieStr, ua } = await getDynamicSession();
                
                console.log("[3/3] Fetching M3U List...");
                const m3uRes = await axios.get(M3U_URL);
                const m3uContent = m3uRes.data;

                // FIXED REGEX: Specifically looks for the ID and ignores extra attributes like group-title
                const regex = /#EXTINF:-1.*?tvg-id="(\d+)"\s*.*?tvg-logo="(.*?)",(.*)/g;
                let match;
                const channels = [];

                while ((match = regex.exec(m3uContent)) !== null) {
                  // Clean the ID just in case
                  const cleanId = match[1].replace(/[^0-9]/g, ''); 
                  channels.push({ id: cleanId, logo: match[2], name: match[3].trim() });
                }

                console.log(`Starting Scrape for ${channels.length} channels...`);

                const finalData = [];
                const batchSize = 10; 

                for (let i = 0; i < channels.length; i += batchSize) {
                  const batch = channels.slice(i, i + batchSize);
                  
                  const results = await Promise.all(batch.map(async (item) => {
                    try {
                      const headers = {
                        "User-Agent": ua,
                        "Cookie": cookieStr,
                        "Referer": `${PHP_BASE}?id=${item.id}&i=1`
                      };

                      // Handshake Step 1
                      await axios.get(`${PHP_BASE}?id=${item.id}&i=1`, { headers, timeout: 12000 });

                      // Handshake Step 2
                      const res = await axios.get(`${PHP_BASE}?id=${item.id}&i=2`, { headers, timeout: 12000 });

                      const configMatch = res.data.match(/const\s+SERVER_CONFIG\s*=\s*(\{.*?\});/s);
                      if (configMatch) {
                        const config = JSON.parse(configMatch[1]);
                        console.log(`[SUCCESS] ${item.name}`);
                        return {
                          "name": item.name,
                          "id": item.id,
                          "logo": item.logo,
                          "streamUrl": config.streamUrls?.[0] || "",
                          "keyId": config.keyId || "",
                          "key": config.key || "",
                          "token": config.primaryCookie || "",
                          "fallbackCookie": config.fallbackCookie || ""
                        };
                      }
                      return null;
                    } catch (err) {
                      return null;
                    }
                  }));

                  finalData.push(...results.filter(r => r !== null));
                  if (i % 50 === 0) console.log(`Processed ${i} channels...`);
                  await new Promise(r => setTimeout(r, 1000));
                }

                fs.writeFileSync('channels_output.json', JSON.stringify(finalData, null, 4));
                console.log(`COMPLETED. Final count: ${finalData.length}`);
            } catch (err) {
                console.error("FATAL ERROR:", err.message);
            }
          }

          scrape();
          EOF
          node scraper.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels_output.json
          git commit -m "Fixed ID Extraction Update: $(date)" || exit 0
          git push
