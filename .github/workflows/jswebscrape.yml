name: ALLIN ONE NEW WDLIVE Scraper

on:
  #schedule:
    #- cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install axios hpagent

      - name: Run Scraper
        run: |
          cat << 'EOF' > scraper.js
          const axios = require('axios');
          const fs = require('fs');
          const { HttpProxyAgent, HttpsProxyAgent } = require('hpagent');

          // --- CONFIGURATION ---
          const M3U_SOURCE = "https://raw.githubusercontent.com/ascal-dev/matchlinks-jsontom3u/main/Refined.m3u";
          const BASE_URL = "https://allinonereborn.online/jtvweb/pind.php";
          const MANUAL_COOKIES = "human=1; js_verified=1"; 
          const USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.6723.70 Safari/537.36";
          const JSON_FILE = 'wdlive_output.json';
          const M3U_FILE = 'wdlive.m3u';

          let proxies = [];

          async function getProxyList() {
              console.log("--- [SYSTEM] FETCHING FRESH PROXY POOL ---");
              try {
                  const res = await axios.get('https://api.proxyscrape.com/v2/?request=displayproxies&protocol=http&timeout=10000&country=all&ssl=all&anonymity=all');
                  proxies = res.data.split(/\r?\n/).map(p => p.trim()).filter(p => p.length > 5);
                  console.log(`--- [SYSTEM] LOADED ${proxies.length} PROXIES ---`);
              } catch (e) {
                  console.log("--- [ERROR] PROXY FETCH FAILED. USING LOCAL IP ---");
              }
          }

          function getAgent(proxy) {
              if (!proxy) return {};
              const proxyUrl = `http://${proxy}`;
              return {
                  httpAgent: new HttpProxyAgent({ proxy: proxyUrl, keepAlive: true, timeout: 40000 }),
                  httpsAgent: new HttpsProxyAgent({ proxy: proxyUrl, keepAlive: true, timeout: 40000 })
              };
          }

          async function fetchWithProxy(url, headers, retries = 15) {
              for (let i = 0; i < retries; i++) {
                  if (proxies.length === 0) {
                      console.log("--- [ALERT] PROXY POOL EXHAUSTED ---");
                      return null;
                  }

                  const activeProxy = proxies[0];
                  try {
                      const response = await axios.get(url, {
                          headers,
                          ...getAgent(activeProxy),
                          timeout: 30000 // High timeout for slow public proxies
                      });
                      return response;
                  } catch (e) {
                      // Remove failed proxy immediately so we don't use it again
                      proxies.shift();
                      const reason = e.response ? `Status ${e.response.status}` : "TIMEOUT/DEAD";
                      console.log(`[ATTEMPT ${i+1}] Proxy ${activeProxy} failed (${reason}). Trying next...`);
                  }
              }
              return null;
          }

          async function run() {
              await getProxyList();

              // Initialize Files
              fs.writeFileSync(M3U_FILE, '#EXTM3U x-tvg-url=""\n\n');
              fs.writeFileSync(JSON_FILE, '[]');

              console.log("--- [SYSTEM] FETCHING SOURCE CHANNELS ---");
              const sourceM3U = await axios.get(M3U_SOURCE);
              const regex = /#EXTINF:-1.*?tvg-id="(\d+)"\s*.*?tvg-logo="(.*?)",(.*)/g;
              let match, channels = [];
              
              while ((match = regex.exec(sourceM3U.data)) !== null) {
                  channels.push({ id: match[1].trim(), logo: match[2], name: match[3].trim() });
              }

              console.log(`--- [START] PROCESSING ${channels.length} CHANNELS ---`);

              let finalResults = [];
              const headers = {
                  "User-Agent": USER_AGENT,
                  "Cookie": MANUAL_COOKIES,
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                  "Sec-Ch-Ua": '"Not?A_Brand";v="99", "Chromium";v="130"',
                  "Sec-Fetch-Dest": "document",
                  "Sec-Fetch-Mode": "navigate",
                  "Sec-Fetch-Site": "same-origin",
                  "Upgrade-Insecure-Requests": "1"
              };

              for (const ch of channels) {
                  console.log(`\n[TARGET] ${ch.name}`);

                  // Step 1: Prime Session
                  const s1 = await fetchWithProxy(`${BASE_URL}?id=${ch.id}`, { ...headers, Referer: BASE_URL });
                  if (!s1) { console.log(`⏩ Skipping ${ch.name}: Session failed.`); continue; }

                  await new Promise(r => setTimeout(r, 1000));

                  // Step 2: Get Stream Info
                  const s2 = await fetchWithProxy(`${BASE_URL}?id=${ch.id}&i=1`, { ...headers, Referer: `${BASE_URL}?id=${ch.id}` });
                  if (!s2) { console.log(`⏩ Skipping ${ch.name}: Config failed.`); continue; }

                  try {
                      const configMatch = s2.data.match(/const\s+SERVER_CONFIG\s*=\s*(\{.*?\});/s);
                      if (configMatch) {
                          const config = JSON.parse(configMatch[1]);
                          const streamUrl = config.streamUrls[0] || "";

                          // INSTANT JSON STORE
                          const entry = {
                              name: ch.name,
                              id: ch.id,
                              logo: ch.logo,
                              url: streamUrl,
                              clearkey: { keyId: config.keyId, key: config.key },
                              updated: new Date().toISOString()
                          };
                          finalResults.push(entry);
                          fs.writeFileSync(JSON_FILE, JSON.stringify(finalResults, null, 4));

                          // INSTANT M3U STORE
                          let m3uLine = `#EXTINF:-1 tvg-id="${ch.id}" tvg-logo="${ch.logo}" group-title="WDLIVE",${ch.name}\n`;
                          if (config.keyId && config.key) {
                              m3uLine += `#KODIPROP:inputstream.adaptive.license_type=clearkey\n`;
                              m3uLine += `#KODIPROP:inputstream.adaptive.license_key=${config.keyId}:${config.key}\n`;
                          }
                          m3uLine += `${streamUrl}\n\n`;
                          fs.appendFileSync(M3U_FILE, m3uLine);

                          console.log(`✅ [SUCCESS] ${ch.name} added to WDLIVE.`);
                      }
                  } catch (parseErr) {
                      console.log(`❌ [ERROR] Could not parse data for ${ch.name}`);
                  }
                  
                  // Human-mimic delay
                  await new Promise(r => setTimeout(r, 2000));
              }

              console.log("\n--- [COMPLETE] SCRAPE FINISHED ---");
          }

          run();
          EOF
          node scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wdlive_output.json wdlive.m3u
          git commit -m "WDLIVE: Full Persistence Update $(date)" || exit 0
          git push
