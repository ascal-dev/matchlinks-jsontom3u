name: ALLIN ONE NEW WDLIVE Scraper

on:
  #schedule:
    #- cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install axios

      - name: Run Scraper
        run: |
          cat << 'EOF' > scraper.js
          const axios = require('axios');
          const fs = require('fs');

          // --- CONFIGURATION ---
          const M3U_SOURCE = "https://raw.githubusercontent.com/ascal-dev/matchlinks-jsontom3u/main/Refined.m3u";
          const BASE_URL = "https://allinonereborn.online/jtvweb/pind.php";
          
          /** * PASTE YOUR FRESH COOKIES HERE 
           * To get these: Open the site in your browser, Press F12, 
           * go to Network tab, refresh, and copy the 'Cookie' header.
           **/
          const MANUAL_COOKIES = "human=1; js_verified=1"; 
          const USER_AGENT = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.6723.70 Safari/537.36";

          const JSON_OUTPUT = 'wdlive_output.json';
          const M3U_OUTPUT = 'wdlive.m3u';
          // ---------------------

          // Initialize files with WDLIVE branding
          fs.writeFileSync(M3U_OUTPUT, '#EXTM3U x-tvg-url="" url-tvg=""\n\n');
          fs.writeFileSync(JSON_OUTPUT, '[]');

          async function fetchChannel(item) {
              try {
                  const headers = {
                      "User-Agent": USER_AGENT,
                      "Cookie": MANUAL_COOKIES,
                      "Referer": `${BASE_URL}?id=${item.id}`,
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
                      "Connection": "keep-alive",
                      "Upgrade-Insecure-Requests": "1",
                      "Sec-Fetch-Dest": "document",
                      "Sec-Fetch-Mode": "navigate",
                      "Sec-Fetch-Site": "same-origin"
                  };

                  // Step 1: Hit the base page to establish the session for this ID
                  console.log(`[WDLIVE] Priming session for: ${item.name}...`);
                  await axios.get(`${BASE_URL}?id=${item.id}`, { headers, timeout: 15000 });
                  
                  // Wait 2 seconds to mimic human reading/loading time
                  await new Promise(r => setTimeout(r, 2000));

                  // Step 2: Request the specific stream config via &i=1
                  const res = await axios.get(`${BASE_URL}?id=${item.id}&i=1`, { headers, timeout: 15000 });
                  
                  // Regex to extract the SERVER_CONFIG object from script tag
                  const configMatch = res.data.match(/const\s+SERVER_CONFIG\s*=\s*(\{.*?\});/s);

                  if (configMatch) {
                      return JSON.parse(configMatch[1]);
                  } else {
                      console.log(`❌ SERVER_CONFIG not found for: ${item.name}. Check if cookies are expired.`);
                  }
              } catch (err) {
                  console.log(`⚠️ Network Error on ID ${item.id}: ${err.message}`);
              }
              return null;
          }

          function writeToFiles(item, config, allData) {
              const streamUrl = config.streamUrls?.[0] || "";
              
              // 1. Construct JSON entry
              const entry = {
                  "name": item.name,
                  "id": item.id,
                  "logo": item.logo,
                  "url": streamUrl,
                  "clearkey": {
                      "keyId": config.keyId || "",
                      "key": config.key || ""
                  },
                  "updated_at": new Date().toISOString()
              };
              allData.push(entry);
              
              // Overwrite JSON file with updated array
              fs.writeFileSync(JSON_OUTPUT, JSON.stringify(allData, null, 4));

              // 2. Append to M3U immediately for persistence
              let m3uEntry = `#EXTINF:-1 tvg-id="${item.id}" tvg-logo="${item.logo}" group-title="WDLIVE",${item.name}\n`;
              if (config.keyId && config.key) {
                  m3uEntry += `#KODIPROP:inputstream.adaptive.license_type=clearkey\n`;
                  m3uEntry += `#KODIPROP:inputstream.adaptive.license_key=${config.keyId}:${config.key}\n`;
              }
              m3uEntry += `${streamUrl}\n\n`;
              
              fs.appendFileSync(M3U_OUTPUT, m3uEntry);
              console.log(`✅ Successfully Saved: ${item.name}`);
          }

          async function start() {
              console.log("--- ALLIN ONE NEW WDLIVE SCRAPER INITIALIZED ---");
              
              // Get the source list of channels
              const source = await axios.get(M3U_SOURCE);
              const regex = /#EXTINF:-1.*?tvg-id="(\d+)"\s*.*?tvg-logo="(.*?)",(.*)/g;
              let match, channelList = [];
              
              while ((match = regex.exec(source.data)) !== null) {
                  channelList.push({ 
                      id: match[1].trim(), 
                      logo: match[2], 
                      name: match[3].trim() 
                  });
              }

              console.log(`Total channels found in source: ${channelList.length}`);

              const results = [];
              for (const channel of channelList) {
                  const config = await fetchChannel(channel);
                  if (config) {
                      writeToFiles(channel, config, results);
                  }
                  
                  // Human-mimic delay (between 3 and 5 seconds)
                  const randomDelay = 3000 + Math.floor(Math.random() * 2000);
                  await new Promise(r => setTimeout(r, randomDelay)); 
              }

              console.log(`\n--- SCRAPE FINISHED: ${results.length} CHANNELS CAPTURED ---`);
          }

          start();
          EOF
          node scraper.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wdlive_output.json wdlive.m3u
          git commit -m "WDLIVE Auto-Update: $(date)" || exit 0
          git push
