name: High-Speed Channel Scraper

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install axios

      - name: Run Scraper
        run: |
          cat << 'EOF' > scraper.js
          const axios = require('axios');
          const fs = require('fs');

          const M3U_URL = "https://raw.githubusercontent.com/ascal-dev/matchlinks-jsontom3u/main/Refined.m3u";
          const PHP_BASE = "https://allinonerebornxjtv.iceiy.com/jtvxweb/pind.php";
          
          // IMPORTANT: Update this cookie value frequently!
          const TEST_COOKIE = "__test=bc343951fa31675be002acbfa68b6a51";

          const HEADERS = {
            "Cookie": TEST_COOKIE,
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
            "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8",
            "Referer": "https://allinonerebornxjtv.iceiy.com/",
            "Connection": "keep-alive"
          };

          async function scrape() {
            console.log("--- STARTING SCRAPE ---");
            try {
                const m3uRes = await axios.get(M3U_URL);
                const m3uContent = m3uRes.data;
                const regex = /#EXTINF:-1 tvg-id="(.*?)" tvg-logo="(.*?)",(.*)/g;
                let match;
                const tasks = [];

                while ((match = regex.exec(m3uContent)) !== null) {
                  tasks.push({ id: match[1], logo: match[2], name: match[3].trim() });
                }

                console.log(`--- FOUND ${tasks.length} CHANNELS ---`);

                const finalData = [];
                const batchSize = 10; // Process 10 at a time to avoid blocking

                for (let i = 0; i < tasks.length; i += batchSize) {
                  const batch = tasks.slice(i, i + batchSize);
                  console.log(`Processing batch ${i / batchSize + 1}...`);

                  const results = await Promise.all(batch.map(async (item) => {
                    try {
                      const res = await axios.get(`${PHP_BASE}?id=${item.id}&i=2`, { 
                        headers: { ...HEADERS, "Referer": `${PHP_BASE}?id=${item.id}&i=1` },
                        timeout: 10000 
                      });

                      // Look for SERVER_CONFIG
                      const configMatch = res.data.match(/const SERVER_CONFIG = (\{.*?\});/);
                      if (configMatch) {
                        const config = JSON.parse(configMatch[1]);
                        console.log(`[OK] ${item.name}`);
                        return {
                          name: item.name,
                          id: item.id,
                          logo: item.logo,
                          streamUrl: config.streamUrls?.[0] || "",
                          keyId: config.keyId || "",
                          key: config.key || "",
                          token: config.primaryCookie || "",
                          fallbackCookie: config.fallbackCookie || ""
                        };
                      }
                      return null;
                    } catch (err) {
                      return null;
                    }
                  }));

                  finalData.push(...results.filter(r => r !== null));
                  // Wait 1 second between batches to stay under the radar
                  await new Promise(resolve => setTimeout(resolve, 1000));
                }

                fs.writeFileSync('channels_output.json', JSON.stringify(finalData, null, 4));
                console.log(`--- DONE. SAVED ${finalData.length} CHANNELS ---`);
            } catch (err) {
                console.error("Error:", err.message);
            }
          }

          scrape();
          EOF
          node scraper.js

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add channels_output.json
          git commit -m "Update channels: $(date)" || exit 0
          git push
