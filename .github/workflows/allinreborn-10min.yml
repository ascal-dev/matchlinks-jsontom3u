name: allinreborn-10min

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Source Playlist
        id: check_file
        run: |
          SOURCE="allinonenorn-jstr.m3u"

          if [ ! -f "$SOURCE" ]; then
            echo "Source file not found."
            echo "valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Count channel entries
          CHANNEL_COUNT=$(grep -c "#EXTINF:" "$SOURCE")

          echo "Channel count: $CHANNEL_COUNT"

          if [ "$CHANNEL_COUNT" -eq 0 ]; then
            echo "Source is EMPTY. Keep previous file unchanged."
            echo "valid=false" >> $GITHUB_OUTPUT
          else
            echo "Source has channels. Will update target."
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Overwrite Target Playlist
        if: steps.check_file.outputs.valid == 'true'
        run: |
          TARGET="allinonereborn-10min.m3u"
          cp allinonenorn-jstr.m3u "$TARGET"
          echo "Target playlist updated."

      - name: Commit Changes
        if: steps.check_file.outputs.valid == 'true'
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add allinonereborn-10min.m3u
          git commit -m "Auto refresh allinonereborn-10min.m3u" || echo "No changes to commit"
          git push
