name: Servertv 





# Explicitly grants write permissions to the repository's contents
permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Fast Channel Extraction Script
      run: |
        node - << 'EOF'
        const fs = require('fs');

        // Main execution function
        async function run() {
          const npointUrl = 'https://api.npoint.io/1ac6a202753a353b7bb5';
          console.log('Fetching source data from npoint...');

          let channelsData;
          try {
            const res = await fetch(npointUrl);
            if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
            channelsData = await res.json();
          } catch (err) {
            console.error('Error fetching data from npoint:', err.message);
            process.exit(1);
          }

          // Normalize data structure if root is an object instead of an array
          let channelsList = channelsData;
          if (!Array.isArray(channelsData) && typeof channelsData === 'object') {
            for (const key in channelsData) {
              if (Array.isArray(channelsData[key])) {
                channelsList = channelsData[key];
                break;
              }
            }
            if (!Array.isArray(channelsList)) {
              channelsList = [channelsData];
            }
          }

          console.log(`Loaded ${channelsList.length} channels. Beginning fast parallel extraction...`);

          // Worker function to handle individual redirects safely using native fetch
          async function resolveChannel(channel) {
            const channelId = channel.id || channel.channel_id || channel.channelId;
            if (!channelId) return channel;

            const targetUrl = `https://servertvhub.site/jiotv+/mpd.php?id=${channelId}`;
            
            try {
              // We perform a standard request but tell fetch to handle the redirect path.
              // Note: Native fetch auto-follows redirects. We capture the final landing URL.
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), 8000); // 8 second strict timeout

              const redirectRes = await fetch(targetUrl, {
                method: 'GET', // Using GET to trace the true resolved location end-to-end
                headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)' },
                signal: controller.signal
              });
              
              clearTimeout(timeoutId);
              const finalUrl = redirectRes.url;

              channel["channel_url_redirect"] = finalUrl;

              if (finalUrl && finalUrl.includes('?')) {
                const [backupUrl, token] = finalUrl.split('?');
                channel["Backup_channel_url"] = backupUrl;
                channel["Channel_token"] = token;
              } else {
                channel["Backup_channel_url"] = finalUrl || "";
                channel["Channel_token"] = "";
              }
            } catch (err) {
              // Handle timeouts or network failures gracefully without breaking the batch
              channel["channel_url_redirect"] = "";
              channel["Backup_channel_url"] = "";
              channel["Channel_token"] = "";
            }

            return channel;
          }

          // Concurrency Pool Execution (Limit to 15 simultaneous requests to maximize speed without hitting rate limits)
          const CONCURRENCY_LIMIT = 15;
          const results = [];
          const executing = [];

          for (const channel of channelsList) {
            const p = Promise.resolve().then(() => resolveChannel(channel));
            results.push(p);

            if (CONCURRENCY_LIMIT <= channelsList.length) {
              const e = p.then(() => executing.splice(executing.indexOf(e), 1));
              executing.push(e);
              if (executing.length >= CONCURRENCY_LIMIT) {
                await Promise.race(executing);
              }
            }
          }
          await Promise.all(results);

          // Write updated structure clean to disk
          try {
            fs.writeFileSync('Servertvhub.json', JSON.stringify(channelsData, null, 4), 'utf-8');
            console.log('Parallel updates complete. Generated Servertvhub.json successfully.');
          } catch (err) {
            console.error('Error writing Servertvhub.json:', err.message);
            process.exit(1);
          }
        }

        run();
        EOF

    - name: Commit and Push updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Servertvhub.json
        git diff-index --quiet HEAD || git commit -m "Fast automated update of channel tokens via Node.js"
        git push origin main

