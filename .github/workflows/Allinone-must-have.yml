name: Allinone must have 
on:
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '0 */6 * * *' # Automatically runs every 6 hours

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch JSON Files
        run: |
          # 1. Define the headers needed for the bypass
          # Note: We use the same domain the server expects to see
          HEADERS=(
            -H "accept: */*"
            -H "accept-language: en-GB,en;q=0.9"
            -H "origin: https://allinonereborn.online"
            -H "referer: https://allinonereborn.online/"
            -H "x-requested-with: XMLHttpRequest"
            -H "user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          )

          echo "Fetching primary json.php with specific spoofed headers..."
          curl -L "${HEADERS[@]}" -H "Host: allinonereborn.online" "https://allinonereborn.online/jtv-fetch/json.php" -o allinone-reborn.json

          echo "Fetching jtv-fetch-json..."
          curl -L "${HEADERS[@]}" "https://allinonereborn.online/jtv-fetch/json.php" -o jtv-fetch-json.json

          echo "Fetching jstrweb2-cookies2.json..."
          curl -L "${HEADERS[@]}" "https://allinonereborn.online/jstrweb2/cookies.json" -o jstrweb2-cookies2.json

          echo "Fetching jtv-fetch-jststarcookie/json..."
          curl -L "${HEADERS[@]}" "https://allinonereborn.online/jtv-fetch/jstarcookie/json.php" -o jtv-fetch-jststarcookie.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add *.json
          git commit -m "Update JSON data: $(date)" || echo "No changes to commit"
          git push
