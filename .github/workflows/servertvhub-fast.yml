name: Production Curl-Only Update JioTV Channels

on:
  schedule:
    # Set to 12 minutes past the hour to completely bypass GitHub cron queue bottlenecks
    - cron: '12 6 * * *'   # 6:12 AM UTC
    - cron: '12 9 * * *'   # 9:12 AM UTC
    - cron: '12 13 * * *'  # 1:12 PM UTC
    - cron: '12 15 * * *'  # 3:12 PM UTC
    - cron: '12 19 * * *'  # 7:12 PM UTC
    - cron: '12 21 * * *'  # 9:12 PM UTC
  workflow_dispatch:       # Allows manual execution at any time

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Execute Resilient Curl Extraction Pipeline
      run: |
        # 1. Fetch source channels payload via curl
        echo "Fetching original channel data from npoint..."
        curl -s "https://api.npoint.io/1ac6a202753a353b7bb5" > channels.json

        # 2. Parse out all valid Channel IDs using jq
        ids=$(jq -r '.[] | .id // .channel_id // .channelId' channels.json)
        echo "Successfully parsed channel IDs. Starting parallel curl processing..."

        # Create temporary storage workspace for async workers
        mkdir -p tmp_ids

        # 3. Parallel Processing Loop with Throttling & Rate-Limit Backoffs
        for id in $ids; do
          (
            target_url="https://servertvhub.site/jiotv+/mpd.php?id=${id}"
            attempt=1
            max_attempts=3
            final_url=""

            while [ $attempt -le $max_attempts ]; do
              # Fire curl request tracking http code & landing destination (-m 9 sets a 9s strict timeout)
              res=$(curl -s -L -m 9 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -w "%{http_code} %{url_effective}" -o /dev/null "$target_url")
              
              http_code=$(echo "$res" | cut -d' ' -f1)
              final_url=$(echo "$res" | cut -d' ' -f2-)

              # Handling Rate Limits (HTTP 429)
              if [ "$http_code" -eq 429 ]; then
                sleep $((attempt * 3))
                attempt=$((attempt + 1))
              # Handling Transient Server Failures (HTTP 5xx)
              elif [ "$http_code" -ge 500 ]; then
                sleep $((attempt * 2))
                attempt=$((attempt + 1))
              else
                # Clean exit on successful codes
                break
              fi
            done

            # Parse out Backup Channel URL and Token parameters
            backup_url="$final_url"
            token=""
            if [[ "$final_url" == *\?* ]]; then
              backup_url="${final_url%%\?*}"
              token="${final_url#*\?}"
            fi

            # Output isolated key/value fragment into individual storage token maps
            printf '"%s": {"channel_url_redirect": "%s", "Backup_channel_url": "%s", "Channel_token": "%s"}\n' "$id" "$final_url" "$backup_url" "$token" > "tmp_ids/${id}.txt"
          ) &

          # Anti-burst micro-stagger launch delay (150ms) to bypass firewall flags
          sleep 0.15

          # Concurrency ceiling safety gate: keeps max 12 parallel curls running concurrently
          if [ $(jobs -r | wc -l) -ge 12 ]; then
            wait -n
          fi
        done

        # Wait for any remaining async background curl processes to wrap up
        wait
        echo "All channel extractions complete. Merging data structural keys..."

        # 4. Construct safe consolidated JSON dictionary
        echo "{" > lookup.json
        cat tmp_ids/*.txt | paste -sd, - >> lookup.json
        echo "}" >> lookup.json
        rm -rf tmp_ids

        # 5. Injection mapping back into the original channels profile structure
        jq --slurpfile lookup lookup.json '
          map(
            . + ($lookup[0][(.id // .channel_id // .channelId | tostring)] // {
              "channel_url_redirect": "",
              "Backup_channel_url": "",
              "Channel_token": ""
            })
          )
        ' channels.json > Servertvhub.json

        # Cleanup transient working components
        rm -f channels.json lookup.json
        echo "Servertvhub.json has been completely rebuilt."

    - name: Commit and Push updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Servertvhub.json
        git diff-index --quiet HEAD || git commit -m "Automated update of channel tokens via pure curl pipeline"
        git push origin main
