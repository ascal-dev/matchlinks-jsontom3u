name: Production Curl-Only Update JioTV Channels

on:
  schedule:
    - cron: '12 6 * * *'
    - cron: '12 9 * * *'
    - cron: '12 13 * * *'
    - cron: '12 15 * * *'
    - cron: '12 19 * * *'
    - cron: '12 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Execute Max-Speed Extraction Pipeline
      run: |
        TOTAL_START=$SECONDS

        echo "Fetching original channel data from npoint..."
        curl -s "https://api.npoint.io/1ac6a202753a353b7bb5" > channels.json

        # Extract clean IDs
        jq -r 'if type=="array" then . else .[keys[0]] end | .[] | .id // .channel_id // .channelId | select(. != null)' channels.json > ids.txt
        channel_count=$(wc -l < ids.txt)
        
        echo "Parsed ${channel_count} IDs. Launching max-concurrency background engine..."
        mkdir -p tmp_ids

        # Worker core function exported so xargs can access it directly
        process_id() {
          id="$1"
          target_url="https://servertvhub.site/jiotv+/mpd.php?id=${id}"
          attempt=1
          max_attempts=2 # Dropped to 2 to prevent any single channel from stalling the 30s limit
          final_url=""

          while [ $attempt -le $max_attempts ]; do
            # Timeout set to 5 seconds max per handshake connection
            res=$(curl -s -m 5 \
              -H "Host: servertvhub.site" \
              -H "Referer: https://servertvhub.site/" \
              -H "Origin: https://servertvhub.site/" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -w "%{http_code}\n%{redirect_url}" \
              -o /dev/null "$target_url")

            http_code=$(echo "$res" | sed -n '1p')
            final_url=$(echo "$res" | sed -n '2p')

            if [ "$http_code" = "429" ] || [[ "$http_code" =~ ^50[0-9]$ ]]; then
              sleep 1
              attempt=$((attempt + 1))
            else
              break
            fi
          done

          backup_url="$final_url"
          token=""
          if [[ "$final_url" == *\?* ]]; then
            backup_url="${final_url%%\?*}"
            token="${final_url#*\?}"
          fi

          printf '"%s": {"channel_url_redirect": "%s", "Backup_channel_url": "%s", "Channel_token": "%s"}\n' "$id" "$final_url" "$backup_url" "$token" > "tmp_ids/${id}.txt"
        }

        # Export function to subshells
        export -f process_id

        # Fire up to 50 concurrent requests simultaneously using xargs engine
        cat ids.txt | xargs -I {} -P 50 bash -c 'process_id "{}"'
        
        echo "All channel extractions finished. Merging structures..."

        # 4. Construct safe consolidated JSON dictionary
        echo "{" > lookup.json
        if [ "$(ls -A tmp_ids 2>/dev/null)" ]; then
          cat tmp_ids/*.txt | paste -sd, - >> lookup.json
        fi
        echo "}" >> lookup.json
        
        # 5. Injection mapping back into original channels profile structure
        jq --slurpfile lookup lookup.json '
          if type=="array" then
            map(
              . + ($lookup[0][(.id // .channel_id // .channelId | tostring)] // {
                "channel_url_redirect": "",
                "Backup_channel_url": "",
                "Channel_token": ""
              })
            )
          else
            .
          end
        ' channels.json > Servertvhub.json

        rm -rf tmp_ids channels.json lookup.json ids.txt
        echo "Servertvhub.json successfully compiled."

        TOTAL_DURATION=$((SECONDS - TOTAL_START))
        echo "========================================================="
        echo " PIPELINE SPEED METRICS"
        echo " Total Channels Processed : ${channel_count}"
        echo " Total Processing Duration: ${TOTAL_DURATION} seconds"
        echo "========================================================="

    - name: Commit and Push updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Servertvhub.json
        git diff-index --quiet HEAD || git commit -m "Automated max-speed update of channel tokens"
        git push origin main
