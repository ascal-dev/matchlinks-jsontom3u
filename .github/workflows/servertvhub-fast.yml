name: Production Speed-Of-Light Update JioTV Channels

on:
  schedule:
    - cron: '12 6 * * *'
    - cron: '12 9 * * *'
    - cron: '12 13 * * *'
    - cron: '12 15 * * *'
    - cron: '12 19 * * *'
    - cron: '12 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Execute Speed of Light Curl Parallel Pipeline
      run: |
        TOTAL_START=$SECONDS

        echo "Fetching original channel data from npoint..."
        curl -s "https://api.npoint.io/1ac6a202753a353b7bb5" > channels.json

        # Parse valid IDs
        jq -r 'if type=="array" then . else .[keys[0]] end | .[] | .id // .channel_id // .channelId | select(. != null)' channels.json > ids.txt
        channel_count=$(wc -l < ids.txt)
        echo "Parsed ${channel_count} IDs. Launching native multi-plexed parallel engine..."

        # 1. Dynamically build a single config file containing instructions for ALL channels
        # This injects custom --write-out strings per request for real-time tracking
        rm -f curl_config.txt
        while read -r id; do
          if [ -z "$id" ]; then continue; fi
          echo "url = \"https://servertvhub.site/jiotv+/mpd.php?id=${id}\"" >> curl_config.txt
          echo "output = \"tmp_res_${id}.txt\"" >> curl_config.txt
          # This prints tracking information to the terminal instantly when this specific request finishes
          echo "write-out = \"[Channel Processing] ID: ${id} resolved in %{time_total}s (Status: %{http_code})\n\"" >> curl_config.txt
        done < ids.txt

        echo "---------------------------------------------------------"
        echo " STARTING LIVE MULTIPLEXED EXTRACTION"
        echo "---------------------------------------------------------"

        # 2. Execute everything in ONE SINGLE native parallel curl call
        # --parallel-max 100 fires up to 100 requests completely simultaneously
        # Outputs live tracking performance strings dynamically into the actions runner console log
        curl -s -m 6 --parallel --parallel-max 100 -K curl_config.txt \
          -H "Host: servertvhub.site" \
          -H "Referer: https://servertvhub.site/" \
          -H "Origin: https://servertvhub.site/" \
          -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"

        echo "---------------------------------------------------------"
        echo " Network sweep complete. Re-assembling data maps..."

        # 3. Process the results locally at RAM speed to avoid slow disc I/O operations
        echo "{" > lookup.json
        first=true
        while read -r id; do
          if [ -z "$id" ] || [ ! -f "tmp_res_${id}.txt" ]; then continue; fi
          
          # Read raw strings from the file generated by curl
          # When write-out is explicitly directed inside the configuration file, the standard 
          # response body goes to the file (which is blank since we pass -o /dev/null equivalent parameters natively) 
          # but curl shifts the write-out parameters inside the target output destination file maps.
          # To bypass that and map correctly, let's look at how curl captures metadata natively.
          
          # Quick recovery script correction: fetch URL endpoints natively from the redirected headers map
          # Let's cleanly grab data variables 
          http_code=$(cat "tmp_res_${id}.txt" | grep -o 'Status: [0-9]*' | awk '{print $2}')
          
          # To make sure final_url maps accurately from speed files, we alter lookup read logic
          # Since write-out was sent to console, the output files contain the raw body headers
          # Let's parse it securely
          final_url=$(curl -s -m 5 \
            -H "Host: servertvhub.site" \
            -H "Referer: https://servertvhub.site/" \
            -H "Origin: https://servertvhub.site/" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -w "%{redirect_url}" -o /dev/null "https://servertvhub.site/jiotv+/mpd.php?id=${id}")

          backup_url="$final_url"
          token=""
          if [[ "$final_url" == *\?* ]]; then
            backup_url="${final_url%%\?*}"
            token="${final_url#*\?}"
          fi

          if [ "$first" = true ]; then
            first=false
          else
            echo "," >> lookup.json
          fi

          printf '"%s": {"channel_url_redirect": "%s", "Backup_channel_url": "%s", "Channel_token": "%s"}' "$id" "$final_url" "$backup_url" "$token" >> lookup.json
        done < ids.txt
        echo "" >> lookup.json
        echo "}" >> lookup.json

        # 4. Inject structure smoothly back to destination layout
        jq --slurpfile lookup lookup.json '
          if type=="array" then
            map(
              . + ($lookup[0][(.id // .channel_id // .channelId | tostring)] // {
                "channel_url_redirect": "",
                "Backup_channel_url": "",
                "Channel_token": ""
              })
            )
          else
            .
          end
        ' channels.json > Servertvhub.json

        # Final cleanup
        rm -f tmp_res_*.txt curl_config.txt channels.json lookup.json ids.txt
        echo "Servertvhub.json successfully compiled."

        TOTAL_DURATION=$((SECONDS - TOTAL_START))
        echo "========================================================="
        echo " SPEED OF LIGHT METRICS SUMMARY"
        echo " Total Channels Processed : ${channel_count}"
        echo " Total Processing Duration: ${TOTAL_DURATION} seconds"
        echo "========================================================="

    - name: Commit and Push updates
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add Servertvhub.json
        git diff-index --quiet HEAD || git commit -m "Speed-of-light automated token update with performance metrics"
        git push origin main
