name: Allinone must have jstrweb2-cookies

on:
  workflow_dispatch: # Allows manual trigger
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST  -> 12:30 AM UTC
    - cron: '30 2 * * *'  # 8:00 AM IST  -> 2:30 AM UTC
    - cron: '30 3 * * *'  # 9:00 AM IST  -> 3:30 AM UTC
    - cron: '30 4 * * *'  # 10:00 AM IST -> 4:30 AM UTC
    - cron: '30 6 * * *'  # 12:00 PM IST -> 6:30 AM UTC
    - cron: '30 7 * * *'  # 1:00 PM IST  -> 7:30 AM UTC
    - cron: '30 8 * * *'  # 2:00 PM IST  -> 8:30 AM UTC
    - cron: '0 9 * * *'   # 2:30 PM IST  -> 9:00 AM UTC
    - cron: '30 9 * * *'  # 3:00 PM IST  -> 9:30 AM UTC
    - cron: '0 10 * * *'  # 3:30 PM IST  -> 10:00 AM UTC
    - cron: '0 13 * * *'  # 6:30 PM IST  -> 1:00 PM UTC
    - cron: '30 13 * * *' # 7:00 PM IST  -> 1:30 PM UTC
    - cron: '0 14 * * *'  # 7:30 PM IST  -> 2:00 PM UTC
    - cron: '30 15 * * *' # 9:00 PM IST  -> 3:30 PM UTC
    - cron: '30 16 * * *' # 10:00 PM IST -> 4:30 PM UTC

permissions:
  contents: write # Required to allow the bot to push changes to your repo

jobs:
  fetch_json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Request JSON with Spoofed Headers
        run: |
          curl -X GET "https://allinonereborn.online/jstrweb2/cookies.json" \
          -H "Host: allinonereborn.online" \
          -H "Origin: https://allinonereborn.online" \
          -H "Referer: https://allinonereborn.online/" \
          -H "X-Requested-With: XMLHttpRequest" \
          -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/124.0.0.0 Safari/537.36" \
          -o jstrweb2-cookies3.json

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add jstrweb2-cookies3.json
          git commit -m "Update jtv-fetch-json2: $(date)" || echo "No changes to commit"
          git push
