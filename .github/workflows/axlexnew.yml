name: Clean M3U Mirror

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download Source Playlists
        run: |
          curl -L https://raw.githubusercontent.com/alex4528x/m3u/main/jstar.m3u -o jstar.m3u
          curl -L https://raw.githubusercontent.com/alex4528x/m3u/main/jtv.m3u -o jtv.m3u

      - name: Create Processing Script
        run: |
          cat << 'EOF' > process.py
          import os

          def is_valid(file):
              try:
                  with open(file, "r") as f:
                      content = f.read()
                      return "#EXTINF" in content
              except:
                  return False

          def clean_file(input_file, output_file):
              if not is_valid(input_file):
                  print(f"Skipping {input_file} (empty or invalid)")
                  return False

              cleaned_lines = []

              with open(input_file, "r") as f:
                  for line in f:
                      line = line.strip()

                      # ❌ Remove unwanted lines
                      if line.startswith("#EXTHTTP"):
                          continue
                      if line.startswith("#Generated"):
                          continue

                      cleaned_lines.append(line)

              # ✅ Ensure single header
              output_content = "#EXTM3U\n\n" + "\n".join(
                  [l for l in cleaned_lines if l != "#EXTM3U"]
              ) + "\n"

              with open(output_file, "w") as out:
                  out.write(output_content)

              print(f"Updated {output_file}")
              return True


          updated = False

          if clean_file("jstar.m3u", "ascaljstar.m3u"):
              updated = True

          if clean_file("jtv.m3u", "ascaljtv.m3u"):
              updated = True

          if not updated:
              print("No valid update, keeping old files.")
          EOF

      - name: Run Script
        run: python3 process.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add ascaljstar.m3u ascaljtv.m3u

          git diff --quiet && git diff --staged --quiet || git commit -m "Update clean M3U"

          git push
